<text x="503.3" y="370.0" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal">4</text>
<line x1="571.7" y1="74" x2="571.7" y2="352" stroke="#d0d7de" stroke-dasharray="2,4"/>
<text x="571.7" y="370.0" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal">8</text>
<line x1="640.0" y1="74" x2="640.0" y2="352" stroke="#d0d7de" stroke-dasharray="2,4"/>
<text x="640.0" y="370.0" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal">16</text>
<text x="435.0" y="392.0" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal">Odds ratio</text>
<text x="360.7" y="68.0" font-size="11" fill="#656d76" text-anchor="end" font-weight="normal">&#8592; lower odds</text>

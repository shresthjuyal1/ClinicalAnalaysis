<text x="366.7" y="370.0" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal">1</text>
<line x1="435.0" y1="74" x2="435.0" y2="352" stroke="#d0d7de" stroke-dasharray="2,4"/>
<text x="435.0" y="370.0" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal">2</text>

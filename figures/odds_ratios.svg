<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="820" height="400" fill="#ffffff"/>
<text x="24.0" y="34.0" font-size="18" fill="#1f2328" text-anchor="start" font-weight="600">Adjusted odds ratios for lung cancer (full model)</text>
<text x="24.0" y="56.0" font-size="12" fill="#656d76" text-anchor="start" font-weight="normal">Points are odds ratios; bars are 95% Wald confidence intervals. Log scale.</text>
<line x1="230.0" y1="74" x2="230.0" y2="352" stroke="#d0d7de" stroke-dasharray="2,4"/>
<text x="230.0" y="370.0" font-size="12" fill="#656d76" text-anchor="middle" font-weight="normal">0.25</text>

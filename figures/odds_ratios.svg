<circle cx="30" cy="378" r="5" fill="#cf222e"/>
<text x="42.0" y="382.0" font-size="12" fill="#656d76" text-anchor="start" font-weight="normal">p &lt; 0.05</text>
<circle cx="118" cy="378" r="5" fill="#57606a"/>
<text x="130.0" y="382.0" font-size="12" fill="#656d76" text-anchor="start" font-weight="normal">not significant</text>
</svg>

<line x1="319.4" y1="278.0" x2="524.6" y2="278.0" stroke="#57606a" stroke-width="2.5"/>
<circle cx="422.0" cy="278.0" r="6" fill="#57606a"/>
<text x="664.0" y="282.0" font-size="12" fill="#57606a" text-anchor="start" font-weight="normal">1.75 (0.62&#8211;4.96)</text>
<text x="214.0" y="326.0" font-size="13" fill="#1f2328" text-anchor="end" font-weight="normal">SES (high vs. low)</text>
<line x1="286.4" y1="322.0" x2="467.6" y2="322.0" stroke="#57606a" stroke-width="2.5"/>

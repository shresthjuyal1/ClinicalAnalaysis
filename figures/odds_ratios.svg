<text x="664.0" y="68.0" font-size="11" fill="#656d76" text-anchor="start" font-weight="600">OR (95% CI)</text>
<text x="214.0" y="106.0" font-size="13" fill="#1f2328" text-anchor="end" font-weight="600">Bird keeping (yes vs. no)</text>
<line x1="421.6" y1="102.0" x2="580.5" y2="102.0" stroke="#cf222e" stroke-width="2.5"/>
<circle cx="501.0" cy="102.0" r="6" fill="#cf222e"/>
<text x="664.0" y="106.0" font-size="12" fill="#cf222e" text-anchor="start" font-weight="600">3.91 (1.75&#8211;8.75)</text>
<text x="214.0" y="150.0" font-size="13" fill="#1f2328" text-anchor="end" font-weight="600">Years smoked (+1 year)</text>
<line x1="368.7" y1="146.0" x2="379.0" y2="146.0" stroke="#cf222e" stroke-width="2.5"/>
<circle cx="373.9" cy="146.0" r="6" fill="#cf222e"/>
<text x="664.0" y="150.0" font-size="12" fill="#cf222e" text-anchor="start" font-weight="600">1.08 (1.02&#8211;1.13)</text>
<text x="214.0" y="194.0" font-size="13" fill="#1f2328" text-anchor="end" font-weight="normal">Cigarettes per day (+1)</text>
<line x1="364.3" y1="190.0" x2="374.2" y2="190.0" stroke="#57606a" stroke-width="2.5"/>
<circle cx="369.2" cy="190.0" r="6" fill="#57606a"/>
<text x="664.0" y="194.0" font-size="12" fill="#57606a" text-anchor="start" font-weight="normal">1.03 (0.98&#8211;1.08)</text>
<text x="214.0" y="238.0" font-size="13" fill="#1f2328" text-anchor="end" font-weight="normal">Age (+1 year)</text>
<line x1="355.8" y1="234.0" x2="369.6" y2="234.0" stroke="#57606a" stroke-width="2.5"/>
